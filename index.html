  /* Type */
  --text:#FFFFFF;
  --text-2:rgba(255,255,255,.62);

  /* DXC accents */
  --gold:#FFAE41;

  --red:#D14600;
  --sky:#A1E6FF;
  --true-blue:#4995FF;
  --royal:#004AAC;
  --grey:#B4B0AC;

  --label:var(--gold);

  --font:'Inter',Arial,Helvetica,sans-serif;
  --r-sm:8px; --r-md:14px; --r-lg:20px; --r-pill:999px;
  --ease:cubic-bezier(.22,1,.36,1);
}

*{box-sizing:border-box;margin:0;padding:0}

}

.small{font-size:clamp(12.5px,.9vw,14px);font-weight:300;line-height:1.5;color:var(--text-2)}

/* ---------- Surfaces ----------------------------------------------------- */
.screen{
  position:relative;overflow:hidden;
  border-radius:var(--r-lg);
  padding:clamp(26px,3vw,48px) clamp(22px,3vw,50px) clamp(124px,9.5vw,148px);
  min-height:clamp(430px,62vh,560px);
  display:flex;flex-direction:column;
}
.screen--depth{background:radial-gradient(1200px 700px at 78% 8%,#16203A 0%,#0A0D16 52%,#06070C 100%)}
.screen--abyss{background:#06070C}

.screen--mist,.screen--slate,.screen--sand,.screen--pearl{
  --text:#0E1020; --text-2:rgba(14,16,32,.70); --text-3:rgba(14,16,32,.46);
  --surface:#FFFFFF; --surface-2:#FFFFFF;
  --line:rgba(14,16,32,.10); --line-strong:rgba(14,16,32,.20);
  --label:var(--red);
  color:var(--text);
}
.screen--mist{background:#F6F3F0}
.screen--slate{background:#EDF1F7;--label:var(--royal)}
.screen--sand{background:#F8EFE5}
.screen--pearl{background:#FFFFFF}

/* Act rail — colour edge showing which phase you are in */
.screen::after{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:var(--rail,transparent);z-index:3;
}
.screen[data-act="1"]{--rail:linear-gradient(180deg,#FFAE41,#FF7E51)}
.screen[data-act="2"]{--rail:linear-gradient(180deg,#FF7E51,#D14600)}
.screen[data-act="3"]{--rail:linear-gradient(180deg,#4995FF,#004AAC)}
.screen[data-act="4"]{--rail:linear-gradient(180deg,#FFC982,#FFAE41)}

/* Artwork layer — decorative only, never holds text */
.art{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.art>*{position:absolute}
.art-mesh{
  inset:0;
  background-image:
    linear-gradient(var(--mesh-c,rgba(255,255,255,.055)) 1px,transparent 1px),
    linear-gradient(90deg,var(--mesh-c,rgba(255,255,255,.055)) 1px,transparent 1px);
  background-size:46px 46px;
  -webkit-mask-image:radial-gradient(120% 90% at 12% 8%,#000 0%,transparent 72%);
  mask-image:radial-gradient(120% 90% at 12% 8%,#000 0%,transparent 72%);

    radial-gradient(circle,transparent 0 60%,var(--ring-c,rgba(255,174,65,.08)) 60% 60.3%,transparent 60.3%);
}
.inner{position:relative;z-index:2;flex:1;display:flex;flex-direction:column}

/* ---------- Reveal cascade ---------------------------------------------- */
.reveal{opacity:0;transform:translateY(14px)}
.screen.on .reveal{animation:revealUp .5s var(--ease) forwards}
.screen.on .reveal:nth-child(1){animation-delay:.03s}
.screen.on .reveal:nth-child(2){animation-delay:.09s}
.screen.on .reveal:nth-child(3){animation-delay:.15s}
.screen.on .reveal:nth-child(4){animation-delay:.21s}
.screen.on .reveal:nth-child(5){animation-delay:.27s}
.screen.on .reveal:nth-child(6){animation-delay:.33s}
@keyframes revealUp{to{opacity:1;transform:translateY(0)}}

/* ---------- Buttons ------------------------------------------------------ */
.btn{

  padding:13px 26px;border-radius:var(--r-pill);border:none;

  padding:5px 11px;border-radius:var(--r-pill);border:1px solid transparent;
}
.badge-blue{background:rgba(73,149,255,.14);color:#2C6FCE;border-color:rgba(73,149,255,.34)}

.badge-melon{background:rgba(255,126,81,.14);color:#C4491F;border-color:rgba(255,126,81,.34)}
.badge-gold{background:rgba(255,174,65,.16);color:#A66200;border-color:rgba(255,174,65,.38)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:clamp(15px,1.4vw,22px)}

.journey{display:flex;align-items:stretch;gap:3px;margin-bottom:14px}
.jseg{flex:1;min-width:0;padding-top:9px;border-top:3px solid rgba(180,176,172,.45);transition:border-color .3s var(--ease)}

.sheet__eb{color:var(--red);font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;margin-bottom:9px}

.sheet__x{position:absolute;top:clamp(18px,2vw,28px);right:clamp(18px,2vw,28px);width:34px;height:34px;
          border-radius:50%;background:#fff;border:1px solid rgba(14,16,32,.12);color:#0E1020;
          font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;
          transition:background .2s,color .2s,transform .2s}

          --text:#0E1020;--text-2:rgba(14,16,32,.70);--text-3:rgba(14,16,32,.46);
          --surface:#FFFFFF;--line:rgba(14,16,32,.10);--label:var(--red)}

/* ---------- Footer ------------------------------------------------------- */
.foot{position:absolute;left:clamp(22px,3vw,50px);right:clamp(22px,3vw,50px);bottom:clamp(20px,2vw,28px);
      display:flex;align-items:flex-end;justify-content:space-between;gap:14px;z-index:2}
.foot img{width:clamp(62px,5vw,80px)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important}
  .reveal{opacity:1;transform:none}
}

.read__t{font-size:clamp(12.5px,.96vw,15px);font-weight:300;line-height:1.5;color:var(--text-2)}
.read__t b{font-weight:600;color:var(--text)}

.ctas{display:grid;gap:9px;margin-top:clamp(14px,1.4vw,20px)}
.ctas__lead{font-size:clamp(12px,.9vw,13.5px);font-weight:300;line-height:1.5;
            color:var(--text-3);max-width:64ch;margin-bottom:3px}
.ctab{display:flex;gap:14px;align-items:flex-start;text-decoration:none;
      padding:clamp(13px,1.3vw,18px) clamp(14px,1.4vw,20px);border-radius:var(--r-md);
      background:var(--gold);color:#1A1206;transition:transform .16s,background .16s}
.ctab:hover{transform:translateY(-1px);background:var(--peach)}
.ctab--alt{background:transparent;color:var(--text);border:1.5px solid var(--line-strong)}
.ctab--alt:hover{background:var(--surface-2);border-color:var(--gold)}
.ctab__n{flex:0 0 26px;height:26px;border:2px solid currentColor;border-radius:50%;
         display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800}
.ctab__b{flex:1;min-width:0;font-size:clamp(14px,1.05vw,16.5px);font-weight:700;letter-spacing:-.005em}
.ctab__b em{display:block;font-style:normal;font-size:clamp(12px,.9vw,13.5px);font-weight:300;
            line-height:1.45;margin-top:5px;opacity:.86}
.ctab:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.ph{display:inline-block;background:var(--peach);color:#1A1206;padding:1px 7px;border-radius:4px;font-weight:700}
.ctab--alt .ph{background:var(--gold)}

/* Option 2 is a button, not a link, so it needs the anchor's box reset */
button.ctab{border:1.5px solid var(--line-strong);text-align:left;width:100%;font-family:inherit}

/* Fallback line under option 1 — a repair path, not a peer option */
.fallback{font-size:clamp(11.5px,.86vw,13px);font-weight:300;line-height:1.5;
          color:var(--text-3);padding:2px 0 6px 40px;max-width:66ch}
.lnk{background:none;border:none;padding:0;font:inherit;color:var(--gold);
     font-weight:600;text-decoration:underline;text-underline-offset:2px}
.lnk:hover{color:var(--peach)}
.lnk:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.fallback .ok{color:var(--gold);font-weight:700}

/* Tally: quarterly CPUs fall in Jan, Apr, Jul, Oct, not four in a row */
.mark--cpu{background:var(--red)}
.mark--cspu{background:var(--gold)}
.mrow{display:flex;gap:4px;margin-top:5px}
.mrow span{width:clamp(8px,.72vw,11px);text-align:center;
           font-size:clamp(8px,.6vw,9.5px);font-weight:600;color:var(--text-3);line-height:1}
.mrow span.m-cpu{color:var(--red);font-weight:800}
.legend{display:flex;flex-wrap:wrap;gap:clamp(12px,1.4vw,22px);margin:-6px 0 clamp(16px,1.8vw,24px)}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:clamp(10.5px,.8vw,12px);
    font-weight:300;color:var(--text-3)}
.sw{width:9px;height:14px;border-radius:1px;display:inline-block}
.sw--cpu{background:var(--red)}
.sw--cspu{background:var(--gold)}
.sw--none{background:rgba(180,176,172,.42)}
</style>
</head>

let S={screen:0, apps:[], host:null, ans:{}};

function appLabel(){
  if(!S.apps.length) return "your Oracle Classic Apps";
  if(S.apps.length===1) return APPS[S.apps[0]].short;
  if(S.apps.length===2) return APPS[S.apps[0]].short+" and "+APPS[S.apps[1]].short;
  return "your "+S.apps.length+" classic applications";
}
function cycleLabel(){
  return S.apps.length===1 ? APPS[S.apps[0]].cycle : "a single patch round across your classic estate";
}
function up(t){return t.charAt(0).toUpperCase()+t.slice(1);}

/* Questions 1, 8 and 9 are phrased so that Yes is the GOOD answer, unlike
   the other nine. Their scoring is inverted in risk() below. Mixed polarity
   is deliberate: it stops people answering Yes straight down the list. */
const INVERTED = [1,8,9];

function sections(){
  const h=HOSTS[S.host]||HOSTS.onprem;
  return [
    {title:"Patch load", qs:[
      {id:1,m:"Partly",t:"Is your patching team currently staffed and funded to support a <b>monthly</b> patching cycle?"},
      {id:2,m:"Not sure",t:"Is at least one Critical Security Patch Update deferred, skipped or still pending since May 2026?"},
      {id:3,m:"Sometimes",t:"Does <b>"+cycleLabel()+"</b> require more than one week of effort from your DBAs and application owners?"}
    ]},
    {title:"Where it runs", qs:[
      {id:4,m:h.m4,t:h.q4},
      {id:5,m:h.m5,t:h.q5}
    ]},
    {title:"Knowledge risk", qs:[
      {id:6,lo:"Automated",m:"Semi-automated",hi:"Manual",
       t:"How is your post-patch validation carried out for <b>"+appLabel()+"</b>?",
       ex:S.apps.length===1?APPS[S.apps[0]].examples:null},
      {id:7,m:"Possibly",t:"Is at least one of the people who carry out that validation expected to retire or leave within the next 24 months?"}
    ]},
    {title:"Evidence gap", qs:[
      {id:8,m:"With effort",t:"Do you have documented evidence proving that all critical Oracle patches have been applied?"},
      {id:9,m:"Partly",t:"Does your patch tracking account for <b>both</b> the monthly CSPUs and the quarterly CPU releases?"}
    ]},
    {title:"AI on these applications", qs:[
      {id:10,m:"Informally",t:"Is there a business request or mandate to add AI capabilities to these applications?"},
      {id:11,m:"Mostly",t:"Is your planned response to migrate to a newer Oracle product, such as Fusion, in order to address that AI requirement?"},
      {id:12,m:"Partly",t:"Are these applications excluded from your organisation's planned AI investment roadmap?"}
    ]}
  ];
}

/* S.ans holds the raw button position (0,1,2 as displayed). risk() converts
   that into an exposure score, flipping the three questions where Yes is the
   good answer. Everything downstream scores in one direction only. */
function risk(id){
  const v=S.ans[id];
  if(v===undefined) return 0;
  return INVERTED.indexOf(id)>=0 ? 2-v : v;
}
function score(){let t=0;for(let i=1;i<=12;i++)t+=risk(i);return t;}
function subs(){const o={};SECS.forEach(s=>{o[s.key]=s.ids.reduce((a,i)=>a+risk(i),0)});return o;}

function band(){
  const s=score();
  if(s<=8)  return {n:"Controlled",c:"#0E1020",f:"#fff",
    t:"Your run model absorbed the change. Worth re testing after the October quarterly CPU, when both streams collide at scale for the first time.",
    long:"On these answers, the change in cadence has not hurt you. Either your run model was already built for frequent change, or the estate is small enough that twelve events a year is absorbable. Both are legitimate. The useful question is which of the two it is, because only the first one keeps working as the cadence accelerates."};
  if(s<=16) return {n:"Stretched",c:"#D14600",f:"#fff",
    t:"You are keeping up on effort rather than design. This is where monthly patching quietly becomes monthly deferral, and the security benefit is lost while the cost stays.",
    long:"This is the most common band and the most expensive one. The work gets done, but it gets done by people staying late rather than by a system that scales. The failure mode is not a missed patch, it is change control friction turning each monthly release into a deferral, so you carry the effort without gaining the security benefit."};
  return {n:"Exposed",c:"#FFAE41",f:"#0E1020",
    t:"Critical fixes are likely sitting unapplied, and you would struggle to prove otherwise at audit. Your constraint is people, not patches.",
    long:"At this level the gap is structural. Critical fixes are probably outstanding right now, and more importantly you would struggle to demonstrate otherwise if asked. In regulated sectors that evidence gap usually surfaces before any incident does. Adding headcount is the obvious answer and the wrong one, because the cadence will keep accelerating."};
}

const HI=k=>{const m=SECS.find(x=>x.key===k).max;return subs()[k]/m>=0.66;};
const LO=k=>{const m=SECS.find(x=>x.key===k).max;return subs()[k]/m<0.34;};

function pattern(){
  if(HI("patch")&&HI("ev")) return {tag:"deferral and evidence",
    text:"Patch load and evidence both scored high. That combination usually means fixes are being deferred and the deferral cannot be evidenced. It is the pattern most likely to surface first at audit rather than in an incident."};
  if(HI("ev")&&!HI("patch")) return {tag:"evidence gap",
    text:"Evidence scored highest while patch load did not. This is not a capacity problem. The work is getting done, but the state of the estate cannot be demonstrated at a point in time."};
  if(HI("know")&&HI("patch")) return {tag:"capacity and key person risk",
    text:"Patch load and knowledge risk both scored high. The volume is difficult and the people who can handle it are few. Adding effort will not resolve either side of that."};
  if(HI("know")&&!HI("patch")) return {tag:"key person risk",
    text:"Knowledge risk is the dominant score while patching is being absorbed. Today is stable, and the risk sits ahead rather than now: a small number of people hold the reasoning about how patches interact with our customisations."};
  if(HI("patch")&&LO("know")&&LO("ev")) return {tag:"capacity",
    text:"Patch load is the dominant score, with knowledge and evidence in reasonable shape. The constraint is the volume of patch events rather than the ability to handle any one of them."};
  if(HI("ai")&&LO("patch")&&LO("know")&&LO("ev")) return {tag:"mandate without pain",
    text:"Patching, knowledge and evidence all scored low. The only elevated score is the AI mandate: the business has asked for something on this application and the answer available so far is to migrate first."};
  if(HI("ai")) return {tag:"mandate on a stretched estate",
    text:"An AI mandate is arriving on top of a run model that is already under pressure. The sequencing question matters more than the technology question here."};
  if(LO("patch")&&LO("know")&&LO("ev")&&LO("ai")) return {tag:"controlled",
    text:"Scores are low across every section. The run model appears to have absorbed the change in cadence. Worth re testing after the October quarterly CPU, when the monthly and quarterly streams collide at scale for the first time."};
  return {tag:"mixed", text:"No single section dominates. Scores are spread across patch load, knowledge, evidence and mandate, which usually means the pressure is cumulative rather than concentrated in one place."};
}

/* Plain text only. RFC 6068 gives mailto no way to carry HTML, and space
   padded columns collapse in any proportional font (Outlook composes in
   Calibri), so this uses one label per line rather than a fake table. The
   real table lives in resultHTML(), for pasting into a mail client. */
function emailText(){
  const t=subs(), sc=score(), b=band(), pat=pattern(), h=HOSTS[S.host];
  let out="ORACLE CLASSIC ESTATE CHECK\nResult, self scored.\n\n";
  out+="WHAT I AM ASKING FOR\nA written read on what this result means for our estate.\n\n";
  out+="CONTACT\nName: \nCompany: \nRole: \nCountry: \n\n";
  out+="ESTATE\n";
  out+="Applications: "+S.apps.map(k=>APPS[k].name).join(", ")+"\n";
  S.apps.forEach(k=>{out+=APPS[k].ver+": \n"});
  out+="Hosting: "+h.name+"\n\n";
  out+="SCORES\n";
  SECS.forEach(s=>{out+=s.label+": "+t[s.key]+" of "+s.max+"\n"});
  out+="Total: "+sc+" of 24, "+b.n+"\n\n";
  out+="PATTERN\n"+pat.text+"\n";
  return out;
}

/* ---------- Copy as a real table -------------------------------------------
   The clipboard can carry text/html, so pasting into Outlook, Gmail or Word
   produces a genuine table in DXC colours. Plain text rides along as the
   fallback flavour for clients that refuse HTML. */
function resultHTML(){
  const t=subs(), sc=score(), b=band(), pat=pattern(), h=HOSTS[S.host];
  const F="font-family:Inter,Calibri,Arial,sans-serif";
  const th="padding:7px 12px;background:#0E1020;color:#ffffff;font-size:11px;letter-spacing:.1em;text-transform:uppercase;text-align:left;font-weight:700";
  const td="padding:7px 12px;border-bottom:1px solid #E3DFDB;font-size:13.5px;color:#0E1020";
  const tdr=td+";text-align:right;font-weight:700;white-space:nowrap";
  let rows="";
  SECS.forEach(s=>{
    const hi=t[s.key]/s.max>=0.66;
    rows+='<tr><td style="'+td+'">'+s.label+'</td><td style="'+tdr+';color:'+(hi?'#D14600':'#0E1020')+'">'+t[s.key]+' / '+s.max+'</td></tr>';
  });
  let est='<tr><td style="'+td+'">Applications</td><td style="'+td+'">'+S.apps.map(k=>APPS[k].name).join(", ")+'</td></tr>';
  S.apps.forEach(k=>{est+='<tr><td style="'+td+'">'+APPS[k].ver+'</td><td style="'+td+';color:#9A958F">to complete</td></tr>';});
  est+='<tr><td style="'+td+'">Hosting</td><td style="'+td+'">'+h.name+'</td></tr>';
  const tbl='cellspacing="0" cellpadding="0" style="border-collapse:collapse;width:100%';

  return '<div style="'+F+';max-width:620px;color:#0E1020">'+
    '<p style="margin:0 0 4px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#D14600">Oracle Classic Estate Check</p>'+
    '<p style="margin:0 0 16px;font-size:20px;font-weight:700">'+S.apps.map(k=>APPS[k].short).join(", ")+' '+h.head+'</p>'+
    '<table '+tbl+';margin-bottom:18px"><tr>'+
      '<td style="padding:14px 18px;background:'+b.c+';color:'+b.f+';font-size:30px;font-weight:700;text-align:center;width:92px">'+sc+'</td>'+
      '<td style="padding:12px 18px;background:#F6F3F0">'+
        '<div style="font-size:16px;font-weight:700;text-transform:uppercase">'+b.n+'</div>'+
        '<div style="font-size:13px;color:#4A4C58;margin-top:3px">'+b.t+'</div></td></tr></table>'+
    '<table '+tbl+';margin-bottom:16px"><tr><th style="'+th+'">Estate</th><th style="'+th+'"></th></tr>'+est+'</table>'+
    '<table '+tbl+';margin-bottom:16px"><tr><th style="'+th+'">Section</th><th style="'+th+';text-align:right">Score</th></tr>'+rows+
      '<tr><td style="'+td+';font-weight:700;border-bottom:2px solid #0E1020">Total</td>'+
      '<td style="'+tdr+';border-bottom:2px solid #0E1020">'+sc+' / 24</td></tr></table>'+
    '<p style="margin:0 0 4px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#004AAC">Pattern in the answers</p>'+
    '<p style="margin:0 0 18px;font-size:13.5px;line-height:1.5;color:#4A4C58">'+pat.text+'</p>'+
    '<table '+tbl+'"><tr><th style="'+th+'">Contact</th><th style="'+th+'"></th></tr>'+
      ['Name','Company','Role','Country','Phone'].map(l=>'<tr><td style="'+td+'">'+l+'</td><td style="'+td+';color:#9A958F">to complete</td></tr>').join('')+
      '</table>'+
    '<p style="margin:16px 0 0;font-size:10.5px;color:#9A958F">Self scored in the browser. \u00A9 2026 DXC Technology Company. All rights reserved.</p></div>';
}

async function copyResult(btn){
  const html=resultHTML(), txt=emailText();
  /* replace the whole line, not just the button, or the trailing clause
     leaves a duplicated instruction behind */
  const line=btn.closest('.fallback');
  const orig=line.innerHTML;
  const done=m=>{line.innerHTML=m;setTimeout(()=>{line.innerHTML=orig;},3600);};
  try{
    await navigator.clipboard.write([new ClipboardItem({
      'text/html': new Blob([html],{type:'text/html'}),
      'text/plain': new Blob([txt],{type:'text/plain'})})]);
    done('<b class="ok">Copied.</b> Paste into a new email to OracleSolutions@dxc.com. The table formatting is preserved.'); return;
  }catch(e){}
  try{
    const d=document.createElement('div');
    d.contentEditable='true';
    d.style.cssText='position:fixed;left:-9999px;top:0';
    d.innerHTML=html; document.body.appendChild(d);
    const r=document.createRange(); r.selectNodeContents(d);
    const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    document.execCommand('copy'); sel.removeAllRanges(); d.remove();
    done('<b class="ok">Copied.</b> Paste into a new email to OracleSolutions@dxc.com. The table formatting is preserved.');
  }catch(e){ done('Copy is not available in this browser. Option 1 or 2 will still work.'); }
}

const MONTHS=["J","F","M","A","M","J","J","A","S","O","N","D"];
const CPU_MONTHS=[0,3,6,9];

function tallyCol(label,note,withCspu){
  let bars='',labs='';
  for(let i=0;i<12;i++){
    const cpu=CPU_MONTHS.indexOf(i)>=0;
    const cls = cpu ? 'mark mark--cpu' : (withCspu ? 'mark mark--cspu' : 'mark');
    bars+='<div class="'+cls+'"></div>';
    labs+='<span'+(cpu?' class="m-cpu"':'')+'>'+MONTHS[i]+'</span>';
  }
  return '<div class="tcol"><span class="tally__l">'+label+'</span>'+
         '<div class="marks">'+bars+'</div>'+
         '<div class="mrow">'+labs+'</div>'+
         '<div class="tally__n">'+note+'</div></div>';
}

function fact(k,v){return '<div class="fact"><div class="fact__k">'+k+'</div><div>'+v+'</div></div>';}
function read(h,t){return '<div class="read"><div class="read__h">'+h+'</div><div class="read__t">'+t+'</div></div>';}

function canNext(){
  const n=S.screen;
  if(n===2) return S.apps.length>0;
  if(n===3) return !!S.host;
  if(n>=4&&n<=8) return sections()[n-4].qs.every(q=>S.ans[q.id]!==undefined);
  return true;
}
function midTxt(){
  if(S.screen===2) return S.apps.length+' selected';
  return '';
}

/* ---------- drill-down sheet ---------- */
/* Twelve identical answers usually means the person clicked through, or is
   not the one who handles patching. Worth naming rather than scoring. */
function straightLine(){
  const v=Object.values(S.ans);
  return v.length===12 && v.every(x=>x===v[0]) ? v[0] : null;
}

function openSheet(){
  const b=band(), sc=score(), sl=straightLine(), pat=pattern();
  document.getElementById('sheetT').textContent=b.n+' \u00b7 '+sc+' of 24';

  let out='<div class="sheet__s"><div class="sheet__st">What this score means</div>'+
          '<p class="body">'+b.long+'</p></div>';

  if(sl!==null){
    out+='<div class="sheet__s"><div class="sheet__st">One thing we noticed</div>'+
      '<p class="body">You gave the same answer to all twelve questions. Three of them are '+
      'phrased so that Yes is the good answer and nine so that Yes is the concerning one, '+
      'which makes a uniform response unlikely to be a real reading of your estate. '+
      'Most often that means the questions were answered quickly, or that patching sits with '+
      'someone else. If it is the second, this is worth forwarding to whoever runs the patch '+
      'cycle. Their answers would be worth having.</p></div>';
  }

  if(b.n==='Controlled'){
    /* No pitch. Someone scoring this low has no problem for us to solve, and
       showing them the offering anyway costs more credibility than it wins. */
    const noAI = subs().ai <= 1;
    out+='<div class="sheet__s"><div class="sheet__st">Our honest read</div>'+
      '<p class="body">Carry on as you are. Patching is absorbed, the knowledge is spread across '+
      'enough people, and you can evidence the state of the estate'+
      (noAI ? '. The business is not asking you for anything on these applications either, so '+
              'there is no problem here for us to solve and we are not going to invent one. '+
              'Nothing needs to change.'
            : '. The only live thread is the AI question, and that is a different conversation '+
              'from patching.')+'</p></div>'+
      '<div class="sheet__s"><div class="sheet__st">Two things worth a glance</div>'+
      '<p class="body">The October quarterly CPU lands on Tuesday 20 October. It is the first time '+
      'the monthly and quarterly streams arrive together at full volume, so it is the honest test '+
      'of a score like this one. Worth re running the check in November.</p>'+
      '<p class="body" style="margin-top:12px">And without looking anything up: which CSPU did you '+
      'apply most recently, who approved it, and where does that evidence live? If all three come '+
      'easily, the score is real.</p></div>';
  } else {
    const ps=PATTERN_STEPS[pat.tag] || {steps:["foundation","operational"],hint:""};
    out+='<div class="sheet__s"><div class="sheet__st">What we do about it</div>'+
      '<p class="body">Oracle supports EBS, PeopleSoft, JD Edwards and Siebel until at least 2037. Staying is a '+
      'valid strategy. One route worth testing is an operating model that can evidence security every month, '+
      'changing how the run works rather than adding people to it.</p>'+
      (ps.hint ? '<p class="body" style="margin-top:10px">'+ps.hint+'</p>' : '')+
      '<div class="framework">'+ps.steps.map((k,i)=>
        '<div class="stage stage--'+(i+1)+'"><div class="stage__h">'+STEPS[k][0]+'</div>'+
        '<div class="stage__b">'+STEPS[k][1]+'</div></div>').join('')+'</div></div>';
  }

  document.getElementById('sheetB').innerHTML=out;
  document.getElementById('sheetB').scrollTop=0;
  document.getElementById('backdrop').classList.add('open');
  document.getElementById('sheet').classList.add('open');
  document.getElementById('sheetX').focus();
}
function closeSheet(){
  document.getElementById('backdrop').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
}

/* ---------- state ---------- */
/* These used to call render(), which rebuilt the screen and replayed the
   reveal cascade on every single click. Now they mutate state and touch only
   the elements that actually changed, so nothing flickers. */
function syncNav(){
  const b=document.getElementById('nextb');
  if(b) b.disabled=!canNext();
  const m=document.querySelector('.nav__mid');
  if(m) m.textContent=midTxt();
}
function tapApp(k){
  const i=S.apps.indexOf(k);
  i>=0 ? S.apps.splice(i,1) : S.apps.push(k);
  const el=document.querySelector('.choice[data-k="'+k+'"]');
  if(el){ el.classList.toggle('sel',S.apps.includes(k)); el.setAttribute('aria-pressed',S.apps.includes(k)); }
  syncNav();
}
function tapHost(k){
  S.host=k;
  document.querySelectorAll('.choice[data-k]').forEach(e=>{
    const on=e.dataset.k===k;
    e.classList.toggle('sel',on); e.setAttribute('aria-pressed',on);
  });
  syncNav();
}
function tapAns(id,v){
  S.ans[id]=v;
  const row=document.querySelector('.q[data-q="'+id+'"]');
  if(row) row.querySelectorAll('.opt').forEach(btn=>{
    const on=+btn.dataset.v===v;
    btn.classList.toggle('sel',on); btn.setAttribute('aria-pressed',on);
  });
  syncNav();
}
function go(d){
  if(d>0&&!canNext())return;
  S.screen=Math.max(0,Math.min(TOTAL-1,S.screen+d));
  document.getElementById('screen').classList.remove('on');
  render();
}
function reset(){S={screen:0,apps:[],host:null,ans:{}};closeSheet();render();}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
render();
</script>
</body>
</html>
